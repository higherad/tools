<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>순위 그래프</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
  /* 디자인: RankForMe 항목 상세 팝업(stats·chart) — 팝업 대신 오른쪽 패널에 표시 */
  :root { --bg:#f3f5f9; --card:#fff; --text:#131722; --sub:#6b7385; --line:#e5e8ef; --pri:#3b5bfd; --pri-soft:#edf0ff; --up:#e5383b; --down:#2f6fed; --start:#ff7a00;
    --shadow:0 1px 2px rgba(20,25,40,.06),0 4px 14px rgba(20,25,40,.05); }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  html,body { margin:0; background:var(--bg); color:var(--text); font-family:Pretendard,-apple-system,system-ui,sans-serif; font-size:15px; letter-spacing:-.2px; }
  body { padding:20px 16px; }
  button { font:inherit; border:0; background:none; cursor:pointer; color:inherit; }
  .wrap { max-width:1280px; margin:0 auto; }
  .main { display:flex; gap:14px; align-items:flex-start; }
  .main[hidden] { display:none !important; }
  #listCard { width:340px; flex:none; margin:0; position:sticky; top:12px; max-height:calc(100vh - 24px); display:flex; flex-direction:column; }
  #listCard .input { flex:none; }
  #list { overflow-y:auto; margin:6px -16px 0; padding:0 16px; }
  #detail { flex:1; min-width:0; margin:0; position:sticky; top:12px; }
  #detail h2 { font-size:19px; margin:8px 0 4px; }
  .list-row.sel { background:var(--pri-soft); margin:0 -10px; padding:11px 10px; border-radius:10px; border-bottom-color:transparent; }
  h1 { font-size:20px; margin:0 0 4px; }
  .muted { color:var(--sub); } .small { font-size:13px; } .tiny { font-size:12px; }
  .up { color:var(--up); font-weight:700; } .down { color:var(--down); font-weight:700; }
  .card { background:var(--card); border-radius:18px; padding:16px; box-shadow:var(--shadow); margin-bottom:12px; }
  .drop { border:2px dashed var(--line); text-align:center; cursor:pointer; color:var(--sub); padding:28px 16px; }
  .drop.over { border-color:var(--pri); background:var(--pri-soft); color:var(--text); }
  .drop.small { padding:12px; font-size:13px; }
  .input { width:100%; height:44px; padding:0 14px; border:1px solid var(--line); border-radius:12px; font:inherit; background:var(--card); outline:none; }
  .input:focus { border-color:var(--pri); }
  .list-row { display:flex; align-items:center; gap:12px; padding:11px 0; border-bottom:1px solid var(--line); cursor:pointer; }
  .list-row:last-child { border-bottom:0; }
  .list-row:hover .nm { color:var(--pri); }
  .list-row .grow { flex:1; min-width:0; }
  .list-row .nm { font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .list-row .chg { font-size:14px; min-width:44px; text-align:right; }
  .tag { display:inline-block; white-space:nowrap; font-size:11px; font-weight:700; padding:2px 7px; border-radius:6px; background:var(--line); color:var(--sub); }
  .row { display:flex; align-items:center; gap:6px; }
  .grow { flex:1; }

  .stats { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; text-align:center; }
  .stats div { background:var(--bg); border-radius:12px; padding:10px 4px; }
  .stats b { display:block; font-size:20px; }
  .stats span { font-size:12px; color:var(--sub); }
  .seg { display:flex; gap:6px; flex-wrap:wrap; margin:0 0 10px; }
  .seg button { height:32px; padding:0 12px; border-radius:10px; background:var(--bg); color:var(--sub); font-size:13px; font-weight:600; white-space:nowrap; }
  .seg button.on { background:var(--pri-soft); color:var(--pri); }
  .ctip { position:absolute; transform:translate(-50%,calc(-100% - 12px)); background:var(--card); border:1px solid var(--line); box-shadow:0 4px 14px rgba(20,25,40,.12); border-radius:10px; padding:6px 10px; font-size:13px; pointer-events:none; white-space:nowrap; display:flex; gap:6px; align-items:baseline; flex-wrap:wrap; width:max-content; max-width:220px; }
  .ctip.below { transform:translate(-50%,12px); } .ctip b { font-size:14px; } .ctip div { flex-basis:100%; white-space:normal; }
  .empty { text-align:center; color:var(--sub); padding:30px 0; font-size:13px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>📈 순위 그래프</h1>
  <div class="muted small" style="margin-bottom:14px">진행현황에서 받은 순위표 엑셀을 넣고 업체를 고르면 오른쪽에 순위 그래프를 보여줍니다.</div>
  <div class="card drop" id="drop">순위표 파일(.xlsx)을 끌어다 놓거나 클릭해서 선택</div>
  <input type="file" id="file" accept=".xlsx,.xls" hidden>
  <div class="main" id="main" hidden>
    <div class="card" id="listCard">
      <input class="input" id="q" placeholder="업체명·키워드·MID·대행사 검색">
      <div id="list"></div>
    </div>
    <div class="card" id="detail"></div>
  </div>
</div>

<script>
const START_FILL = 'FFD966'; // higherad-rank 순위표가 캠페인 시작일 셀에 칠하는 색
const W = 600, H = 260, P = 36;

let rows = [], dates = [], cur = null; // cur = { row, seg }
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));

const drop = $('drop'), fileIn = $('file');
drop.onclick = () => fileIn.click();
fileIn.onchange = () => fileIn.files[0] && load(fileIn.files[0]);
drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
drop.ondragleave = () => drop.classList.remove('over');
drop.ondrop = e => { e.preventDefault(); drop.classList.remove('over'); e.dataTransfer.files[0] && load(e.dataTransfer.files[0]); };

async function load(file) {
  try {
    const wb = XLSX.read(await file.arrayBuffer(), { cellStyles: true });
    const ws = wb.Sheets[wb.SheetNames[0]];
    const aoa = XLSX.utils.sheet_to_json(ws, { header: 1, defval: null });
    const head = (aoa[0] || []).map(v => String(v ?? '').trim());
    const col = name => head.indexOf(name);
    const dateIdx = head.map((h, i) => /^\d{2}-\d{2}$/.test(h) ? i : -1).filter(i => i >= 0);
    if (col('업체명') < 0 || !dateIdx.length) throw new Error('순위표 형식이 아닙니다');

    dates = dateIdx.map(i => head[i]);
    rows = aoa.slice(1).map((r, ri) => ({ r, ri: ri + 1 })).filter(({ r }) => r && r[col('업체명')] != null).map(({ r, ri }) => ({
      name: String(r[col('업체명')] ?? ''),
      agency: String(r[col('대행사')] ?? ''),
      grade: String(r[col('등급')] ?? ''),
      kw: String(r[col('순위키워드')] ?? ''),
      mid: String(r[col('MID')] ?? ''),
      status: String(r[col('상태')] ?? ''),
      chg: col('비교') >= 0 ? r[col('비교')] : null,
      // 숫자 = 순위, '-' = 300위 밖/미체크, null = 추적 전
      vals: dateIdx.map(i => typeof r[i] === 'number' ? r[i] : (String(r[i] ?? '').trim() === '-' ? '-' : null)),
      // 시작일 = 노란 배경 셀의 날짜 열 위치
      starts: dateIdx.map((ci, k) => (ws[XLSX.utils.encode_cell({ r: ri, c: ci })]?.s?.fgColor?.rgb || '').toUpperCase().endsWith(START_FILL) ? k : -1).filter(k => k >= 0),
    }));
    if (!rows.length) throw new Error('데이터 행이 없습니다');

    drop.classList.add('small');
    drop.textContent = `${file.name} · ${rows.length}건 — 다른 파일로 바꾸려면 클릭`;
    $('main').hidden = false;
    $('q').value = '';
    renderList();
    openItem(0, -1);
  } catch (e) {
    alert(`파일을 읽지 못했습니다: ${e.message}`);
  }
}

const dHtml = d => typeof d !== 'number' || !d ? '<span class="muted">-</span>' : d > 0 ? `<span class="up">▲${d}</span>` : `<span class="down">▼${-d}</span>`;

function renderList() {
  const q = $('q').value.trim().toLowerCase();
  const html = rows.map((r, i) => (q && !`${r.name} ${r.kw} ${r.mid} ${r.agency}`.toLowerCase().includes(q)) ? '' :
    `<div class="list-row${cur && cur.i === i ? ' sel' : ''}" data-i="${i}"><div class="grow"><div class="nm">${esc(r.name)}</div>
      <div class="tiny muted" style="margin-top:2px">${esc(r.kw)} · ${esc(r.agency)}</div></div><span class="chg">${dHtml(r.chg)}</span></div>`).join('');
  $('list').innerHTML = html || '<div class="empty">검색 결과가 없어요</div>';
}
$('q').oninput = renderList;
$('list').onclick = e => { const el = e.target.closest('.list-row'); if (el) openItem(+el.dataset.i, -1); };

// seg = -1: 전체, k: k번째 시작일 ~ 다음 시작일 전날(마지막이면 끝까지)
function openItem(i, seg) {
  cur = { i, seg };
  const r = rows[i];
  const a = seg < 0 ? 0 : r.starts[seg];
  const b = seg < 0 || seg === r.starts.length - 1 ? dates.length : r.starts[seg + 1];
  const vals = r.vals.slice(a, b), labels = dates.slice(a, b);
  const nums = vals.filter(v => typeof v === 'number');
  const first = nums[0], last = vals.at(-1);
  const marks = seg < 0 ? r.starts : [];

  const segBtns = r.starts.length ? `<div class="seg"><button class="${seg < 0 ? 'on' : ''}" data-seg="-1">전체</button>${
    r.starts.map((k, n) => `<button class="${seg === n ? 'on' : ''}" data-seg="${n}">${dates[k].replace('-', '/')} 시작</button>`).join('')}</div>` : '';

  document.querySelectorAll('.list-row').forEach(el => el.classList.toggle('sel', +el.dataset.i === i));
  $('detail').innerHTML = (`<div class="row">${r.agency ? `<span class="tag">${esc(r.agency)}</span>` : ''}${r.status ? `<span class="tag">${esc(r.status)}</span>` : ''}</div>
    <h2>${esc(r.name)}</h2><div class="muted small">${esc(r.kw)} · MID ${esc(r.mid)}${r.grade ? ' · ' + esc(r.grade) : ''}</div>
    <div class="stats" style="margin:14px 0">${[
      [first ?? '-', seg < 0 ? '처음' : '시작'],
      [typeof last === 'number' ? last : '-', '마지막'],
      [dHtml(first != null && typeof last === 'number' ? first - last : null), '변동'],
      [nums.length ? Math.min(...nums) : '-', '최고'],
    ].map(([v, l]) => `<div><b>${v}</b><span>${l}</span></div>`).join('')}</div>
    ${segBtns}
    <div class="card" style="box-shadow:none;border:1px solid var(--line);padding:12px 8px 6px;margin:0">${chart(vals, labels, marks)}</div>
    <div class="tiny muted" style="margin-top:8px">${marks.length ? '<span style="color:var(--start)">●</span> 캠페인 시작일 · ' : ''}선이 끊긴 곳은 300위 밖이거나 체크되지 않은 날</div>`);
}

$('detail').onclick = e => { const b = e.target.closest('[data-seg]'); if (b) openItem(cur.i, +b.dataset.seg); };

function chart(vals, labels, marks) {
  const nn = vals.filter(v => typeof v === 'number');
  if (!nn.length) return '<div class="empty">이 기간 순위 기록이 없어요</div>';
  const lo = Math.min(...nn), hi = Math.max(...nn, lo + 1), n = vals.length;
  const st = (W - P - 8) / Math.max(n - 1, 1);
  const x = i => P + i * st, y = v => 10 + (v - lo) / (hi - lo) * (H - 34);
  let path = '', pen = false;
  vals.forEach((v, i) => { if (typeof v !== 'number') { pen = false; return; } path += (pen ? 'L' : 'M') + x(i).toFixed(1) + ',' + y(v).toFixed(1); pen = true; });
  const last = vals.at(-1);
  const xl = [...new Set([0, Math.floor((n - 1) / 2), n - 1])];
  CH = { vals, labels, marks, lo, hi, st };
  return `<div style="position:relative"><svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;touch-action:pan-y" onpointermove="chartTip(event,this)" onpointerleave="this.querySelector('.tip').style.display='none';this.nextElementSibling.hidden=true">
    <g class="tip" style="display:none"><line y1="6" y2="${H - 22}" stroke="var(--line)" stroke-width="1.5"/><circle r="5" fill="var(--card)" stroke="var(--pri)" stroke-width="2.5"/></g>
    ${[...new Set([lo, Math.round((lo + hi) / 2), hi])].map(v => `<line x1="${P}" x2="${W - 8}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${P - 6}" y="${y(v) + 4}" font-size="10" text-anchor="end" fill="var(--sub)">${v}위</text>`).join('')}
    ${marks.map(k => `<line x1="${x(k)}" x2="${x(k)}" y1="6" y2="${H - 22}" stroke="var(--start)" stroke-dasharray="3 3"/><circle cx="${x(k)}" cy="8" r="4" fill="var(--start)"/>`).join('')}
    <path d="${path}" fill="none" stroke="var(--pri)" stroke-width="2.2" stroke-linejoin="round"/>
    ${typeof last === 'number' ? `<circle cx="${x(n - 1)}" cy="${y(last)}" r="4.5" fill="var(--pri)" stroke="var(--card)" stroke-width="2"/>` : ''}
    ${xl.map((i, k) => `<text x="${x(i)}" y="${H - 4}" font-size="10" text-anchor="${xl.length === 1 ? 'middle' : k === 0 ? 'start' : k === xl.length - 1 ? 'end' : 'middle'}" fill="var(--sub)">${labels[i].replace('-', '/')}</text>`).join('')}
  </svg><div class="ctip" hidden></div></div>`;
}

// 그래프 툴팁: 가리킨 날의 점 + 위에 작은 카드(날짜·순위·전날 대비·시작일 표시)
let CH = null;
function chartTip(e, svg) {
  const { vals, labels, marks, lo, hi, st } = CH, b = svg.getBoundingClientRect();
  const i = Math.max(0, Math.min(vals.length - 1, Math.round(((e.clientX - b.left) / b.width * W - P) / st)));
  const v = vals[i], num = typeof v === 'number', xx = P + i * st, yy = num ? 10 + (v - lo) / (hi - lo) * (H - 34) : H - 22;
  const g = svg.querySelector('.tip'), tip = svg.nextElementSibling; g.style.display = '';
  const ln = g.querySelector('line'); ln.setAttribute('x1', xx); ln.setAttribute('x2', xx);
  const c = g.querySelector('circle'); c.setAttribute('cx', xx); c.setAttribute('cy', yy); c.style.display = num ? '' : 'none';
  const p = vals[i - 1];
  tip.innerHTML = `<span class="tiny muted">${labels[i].replace('-', '/')}</span><b>${num ? v + '위' : v === '-' ? '300위 밖' : '기록 없음'}</b>${
    i && num && typeof p === 'number' && p !== v ? (p > v ? `<span class="up">▲${p - v}</span>` : `<span class="down">▼${v - p}</span>`) : ''}${
    marks.includes(i) ? '<div class="tiny" style="color:var(--start)">● 캠페인 시작</div>' : ''}`;
  tip.hidden = false;
  const px = xx / W * b.width, half = tip.offsetWidth / 2;
  tip.style.left = Math.max(half, Math.min(b.width - half, px)) + 'px';
  tip.style.top = yy / H * b.height + 'px';
  tip.classList.toggle('below', yy < H * .35);
}
</script>
</body>
</html>
