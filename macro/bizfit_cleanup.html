<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BizFit 캠페인 취소/삭제</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', -apple-system, sans-serif;
    background: #f0f2f5;
    color: #1a1a2e;
    min-height: 100vh;
  }

  .container {
    max-width: 1200px;
    margin: 24px auto;
    padding: 0 20px;
    display: grid;
    grid-template-columns: 260px 1fr 420px;
    gap: 18px;
    align-items: start;
  }

  .card {
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    overflow: hidden;
  }
  .card-header {
    background: #f8f9fb;
    padding: 13px 18px;
    border-bottom: 1px solid #e8eaf0;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .card-title {
    font-size: 13px;
    font-weight: 700;
    color: #2d3748;
    display: flex;
    align-items: center;
    gap: 7px;
  }
  .card-body { padding: 18px; }

  label {
    display: block;
    font-size: 11px;
    font-weight: 600;
    color: #4a5568;
    margin-bottom: 4px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 8px 16px;
    border-radius: 7px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    border: none;
    transition: all 0.15s;
  }
  .btn-danger   { background: #fff1f0; color: #e53e3e; border: 1.5px solid #fed7d7; padding: 4px 10px; font-size: 12px; border-radius: 6px; white-space: nowrap; }
  .btn-danger:hover   { background: #ffe0de; }
  .btn-run      { background: #7b1fa2; color: #fff; font-size: 14px; font-weight: 800; padding: 12px 24px; border-radius: 8px; width: 100%; }
  .btn-run:hover      { background: #6a1b9a; }
  .btn-run:disabled   { background: #a0aec0; cursor: not-allowed; }
  .btn-sm { padding: 4px 10px; font-size: 12px; }

  /* 테이블 */
  .table-wrap { overflow-x: auto; }
  .mid-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12.5px;
  }
  .mid-table thead th {
    background: #f8f9fb;
    padding: 8px 10px;
    text-align: left;
    font-size: 11px;
    font-weight: 700;
    color: #718096;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    border-bottom: 1px solid #e8eaf0;
    white-space: nowrap;
  }
  .mid-table thead th:first-child { padding-left: 12px; }
  .mid-table tbody tr { border-bottom: 1px solid #f0f2f5; transition: background 0.1s; }
  .mid-table tbody tr:last-child { border-bottom: none; }
  .mid-table tbody tr:hover { background: #fafbfc; }
  .mid-table tbody tr.checked { background: #faf5ff; }
  .mid-table td { padding: 7px 10px; vertical-align: middle; }
  .mid-table td:first-child { padding-left: 12px; }

  .td-mid  { font-weight: 700; color: #2d3748; font-family: monospace; font-size: 12px; }

  .type-badge { display: inline-block; padding: 1px 7px; border-radius: 100px; font-size: 9.5px; font-weight: 700; white-space: nowrap; margin-left: 5px; }
  .type-agency { background: #feebc8; color: #c05621; }

  .action-badge {
    display: inline-block;
    padding: 2px 7px;
    border-radius: 100px;
    font-size: 10px;
    font-weight: 700;
    margin-right: 3px;
  }
  .ab-bizfit { background: #e9d8fd; color: #553c9a; }
  .ab-youpfl { background: #c6f6d5; color: #276749; }
  .ab-none   { background: #fed7d7; color: #c53030; }

  .status-badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 100px;
    font-size: 11px;
    font-weight: 700;
    white-space: nowrap;
  }
  .s-ready   { background: #edf2f7; color: #718096; }
  .s-running { background: #fef9c3; color: #b7791f; }
  .s-success { background: #c6f6d5; color: #276749; }
  .s-partial { background: #feebc8; color: #c05621; }
  .s-fail    { background: #fed7d7; color: #c53030; }

  .select-all-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 9px 14px;
    background: #f8f9fb;
    border-bottom: 1px solid #e8eaf0;
    font-size: 12px;
    font-weight: 600;
    color: #4a5568;
  }
  .select-all-row input[type="checkbox"] { width: 15px; height: 15px; accent-color: #7b1fa2; cursor: pointer; }

  .empty-state { text-align: center; padding: 48px 20px; color: #a0aec0; font-size: 13px; }
  .empty-icon  { font-size: 32px; margin-bottom: 10px; }

  .badge { display: inline-block; padding: 2px 8px; border-radius: 100px; font-size: 11px; font-weight: 700; }
  .badge-purple { background: #faf5ff; color: #6b21a8; border: 1px solid #e9d5ff; }
  .badge-teal { background: #e0f2f1; color: #00695c; border: 1px solid #b2dfdb; }

  .summary-row {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin-bottom: 16px;
  }
  .summary-item {
    background: #f8f9fb;
    border-radius: 8px;
    padding: 12px 14px;
    text-align: center;
  }
  .summary-label { font-size: 10px; font-weight: 700; color: #718096; text-transform: uppercase; letter-spacing: 0.4px; }
  .summary-value { font-size: 22px; font-weight: 800; color: #2d3748; margin-top: 4px; }
  .summary-value.purple { color: #7b1fa2; }

  .log-area {
    background: #1a202c;
    border-radius: 10px;
    padding: 12px 14px;
    height: 320px;
    overflow-y: auto;
    font-family: 'Consolas', 'Monaco', monospace;
    font-size: 12px;
    line-height: 1.7;
  }
  .log-line    { display: flex; gap: 10px; }
  .log-time    { color: #4a5568; flex-shrink: 0; }
  .log-msg     { color: #e2e8f0; }
  .log-success .log-msg { color: #68d391; }
  .log-fail    .log-msg { color: #fc8181; }
  .log-info    .log-msg { color: #b794f4; }
  .log-warn    .log-msg { color: #f6e05e; }

  .progress-wrap { background: #e2e8f0; border-radius: 100px; height: 5px; overflow: hidden; display: none; margin-bottom: 8px; }
  .progress-bar  { height: 100%; background: linear-gradient(90deg, #7b1fa2, #e040fb); border-radius: 100px; width: 0%; transition: width 0.4s ease; }

  .divider { border: none; border-top: 1px solid #e8eaf0; margin: 14px 0; }

  .search-wrap {
    display: flex;
    align-items: center;
    gap: 6px;
    background: #f0f2f5;
    border: 1.5px solid #e2e8f0;
    border-radius: 7px;
    padding: 4px 10px;
    transition: border-color 0.2s;
  }
  .search-wrap:focus-within { border-color: #7b1fa2; background: #fff; }
  .search-wrap input {
    border: none;
    background: transparent;
    outline: none;
    font-size: 12px;
    color: #2d3748;
    width: 140px;
    padding: 0;
    height: 22px;
  }
  .search-wrap input::placeholder { color: #a0aec0; }

  .excel-upload-area {
    border: 2px dashed #cbd5e0;
    border-radius: 10px;
    padding: 18px 16px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
    background: #fafbfc;
  }
  .excel-upload-area:hover, .excel-upload-area.drag-over {
    border-color: #0277bd;
    background: #e3f2fd;
  }
  .excel-upload-area .upload-icon { font-size: 28px; margin-bottom: 6px; }
  .excel-upload-area .upload-text { font-size: 13px; font-weight: 600; color: #4a5568; }
  .excel-upload-area .upload-hint { font-size: 11px; color: #a0aec0; margin-top: 3px; }
  #excel-file-input { display: none; }
  .excel-tpl-btn { display:inline-flex; align-items:center; justify-content:center; width:20px; height:20px; border-radius:5px; border:1px solid #e9d5ff; background:#fff; color:#7b1fa2; text-decoration:none; cursor:pointer; transition:all .15s; }
  .excel-tpl-btn:hover { background:#faf5ff; border-color:#7b1fa2; }

  @media (max-width: 1000px) {
    .container { grid-template-columns: 260px 1fr; }
    .run-panel { grid-column: 1 / -1; }
  }
  @media (max-width: 700px) {
    .container { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="container">

  <!-- 좌측: 엑셀 등록 -->
  <div>
    <div class="card">
      <div class="card-header">
        <span class="card-title">📂 엑셀 등록</span>
        <a class="excel-tpl-btn" href="양식/캠페인_취소삭제_양식.xlsx" download="캠페인_취소삭제_양식.xlsx" title="양식 다운로드"><svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M14 2h-4v11H5l7 7 7-7h-5V2z"/></svg></a>
      </div>
      <div class="card-body">
        <div class="excel-upload-area" id="excel-drop-zone" onclick="document.getElementById('excel-file-input').click()">
          <div class="upload-icon">📊</div>
          <div class="upload-text">클릭 또는 드래그 업로드</div>
          <div class="upload-hint">영업점명 / ID / PW / MID / 비즈핏취소(O) / 유입플환불(O)</div>
        </div>
        <input type="file" id="excel-file-input" accept=".xlsx,.xls" onchange="handleExcelFile(this.files[0])">
      </div>
    </div>
  </div>

  <!-- 중앙: MID 목록 -->
  <div>
    <div class="card">
      <div class="card-header">
        <span class="card-title">📋 처리 목록 <span class="badge badge-purple" id="entry-count">0</span></span>
        <div class="search-wrap">
          <span style="font-size:12px;">🔍</span>
          <input type="text" id="inp-search" placeholder="영업점명 / MID 검색" oninput="filterList(this.value)" lang="ko" inputmode="text" />
        </div>
      </div>
      <div class="select-all-row">
        <input type="checkbox" id="chk-all" onchange="toggleAll(this)">
        <span>전체 선택</span>
        <span style="color:#718096;font-weight:400;" id="selected-count-small">0개 선택됨</span>
        <div style="margin-left:auto;display:flex;gap:6px;">
          <button class="btn btn-danger btn-sm" onclick="removeAll()">전체삭제</button>
        </div>
      </div>
      <div class="table-wrap">
        <table class="mid-table" id="mid-table">
          <thead>
            <tr>
              <th style="width:36px;"></th>
              <th>MID / 영업점명</th>
              <th>처리 작업</th>
              <th style="width:72px;">상태</th>
            </tr>
          </thead>
          <tbody id="entry-tbody">
            <tr><td colspan="4">
              <div class="empty-state">
                <div class="empty-icon">📋</div>
                <div>등록된 MID가 없습니다.<br>좌측에서 엑셀로 등록해주세요.</div>
              </div>
            </td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- 우측: 실행 패널 -->
  <div class="run-panel">
    <div class="card">
      <div class="card-header">
        <span class="card-title">⚡ 실행</span>
        <span class="badge badge-teal" id="server-status">연결 확인 중...</span>
      </div>
      <div class="card-body">
        <div class="summary-row">
          <div class="summary-item">
            <div class="summary-label">선택 항목</div>
            <div class="summary-value purple" id="sum-count">0</div>
          </div>
          <div class="summary-item">
            <div class="summary-label">미선택 작업</div>
            <div class="summary-value" id="sum-noact" style="color:#e53e3e;">0</div>
          </div>
        </div>

        <hr class="divider">

        <button class="btn btn-run" id="btn-run" onclick="startProcess()" disabled>
          ⚡ 처리 시작
        </button>

        <div style="height:10px;"></div>
        <div class="progress-wrap" id="progress-wrap">
          <div class="progress-bar" id="progress-bar"></div>
        </div>
        <div style="text-align:center;font-size:12px;color:#718096;margin-top:4px;" id="progress-text"></div>

        <div class="log-area" id="log-area" style="margin-top:14px;">
          <div class="log-line log-info">
            <span class="log-time">--:--:--</span>
            <span class="log-msg">MID를 추가하고 실행하세요.</span>
          </div>
        </div>
      </div>
    </div>
  </div>

</div>

<script>
const SERVER = 'https://bizfit-direct-proxy-938928195180.asia-northeast3.run.app';

let entries = [];

function save() {
  if (window.fbSave) window.fbSave(entries);
}

// ── 삭제 ──
function removeAll() {
  if (!entries.length) { alert('삭제할 항목이 없습니다.'); return; }
  if (!confirm(`전체 ${entries.length}개 항목을 삭제하시겠습니까?`)) return;
  entries = [];
  save(); renderList();
}

// ── 체크박스 ──
function toggleItem(i, el) {
  entries[i].checked = el.checked;
  const row = document.getElementById(`row-${i}`);
  if (row) row.classList.toggle('checked', el.checked);
  syncAll();
}
function toggleAll(el) {
  entries.forEach(e => e.checked = el.checked);
  save(); renderList();
}
function syncAll() {
  const total   = entries.length;
  const checked = entries.filter(e => e.checked).length;
  const allChk  = document.getElementById('chk-all');
  allChk.checked       = total > 0 && checked === total;
  allChk.indeterminate = checked > 0 && checked < total;
  document.getElementById('selected-count-small').textContent = `${checked}개 선택됨`;
  updateSummary();
}
function updateSummary() {
  const sel   = entries.filter(e => e.checked);
  const noAct = sel.filter(e => !e.do_bizfit && !e.do_youpfl).length;
  document.getElementById('sum-count').textContent = sel.length;
  document.getElementById('sum-noact').textContent = noAct;
  document.getElementById('btn-run').disabled = sel.length === 0 || noAct > 0;
}

// ── 검색 ──
let searchQuery = '';
function filterList(val) { searchQuery = val.trim().toLowerCase(); renderList(); }

// ── 렌더링 ──
function renderList() {
  const tbody = document.getElementById('entry-tbody');
  document.getElementById('entry-count').textContent = entries.length;

  if (!entries.length) {
    tbody.innerHTML = `<tr><td colspan="4"><div class="empty-state"><div class="empty-icon">📋</div><div>등록된 MID가 없습니다.<br>좌측에서 엑셀로 등록해주세요.</div></div></td></tr>`;
    syncAll(); return;
  }

  const filtered = searchQuery
    ? entries.filter(e => e.mid.includes(searchQuery) || (e.agency||'').toLowerCase().includes(searchQuery))
    : entries;

  if (!filtered.length) {
    tbody.innerHTML = `<tr><td colspan="4"><div class="empty-state"><div class="empty-icon">🔍</div><div>검색 결과가 없습니다.</div></div></td></tr>`;
    syncAll(); return;
  }

  const sc = { ready:'s-ready', running:'s-running', success:'s-success', partial:'s-partial', fail:'s-fail' };
  const st = { ready:'대기', running:'⏳ 진행중', success:'✅ 완료', partial:'⚠️ 부분', fail:'❌ 실패' };

  tbody.innerHTML = filtered.map(e => {
    const i = entries.indexOf(e);
    return `
    <tr id="row-${i}" class="${e.checked ? 'checked' : ''}">
      <td><input type="checkbox" ${e.checked?'checked':''} onchange="toggleItem(${i},this)" style="width:15px;height:15px;accent-color:#7b1fa2;cursor:pointer;"></td>
      <td>
        <div class="td-mid">${esc(e.mid)}${e.agency ? `<span class="type-badge type-agency">${esc(e.agency)}</span>` : ''}</div>
        ${e.result ? `<div style="font-size:10.5px;color:#718096;margin-top:2px;">${esc(e.result)}</div>` : ''}
      </td>
      <td>
        ${e.do_bizfit ? '<span class="action-badge ab-bizfit">비즈핏취소</span>' : ''}
        ${e.do_youpfl ? '<span class="action-badge ab-youpfl">유입플환불</span>' : ''}
        ${(!e.do_bizfit && !e.do_youpfl) ? '<span class="action-badge ab-none">미선택</span>' : ''}
      </td>
      <td><span class="status-badge ${sc[e.status]||'s-ready'}">${st[e.status]||'대기'}</span></td>
    </tr>`;
  }).join('');

  syncAll();
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// NDJSON 스트림(줄마다 JSON 한 개)을 읽으며 {type:"log"}는 onLog로 즉시 흘려보내고,
// 마지막 {type:"result", success, results|message} 한 줄을 반환한다.
async function fetchStream(url, body, onLog) {
  const res = await fetch(url, {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
  });
  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let buf = '', final = null;
  const consume = line => {
    if (!line.trim()) return;
    const evt = JSON.parse(line);
    if (evt.type === 'log') onLog(evt.msg); else final = evt;
  };
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += decoder.decode(value, { stream: true });
    const lines = buf.split('\n');
    buf = lines.pop();
    lines.forEach(consume);
  }
  if (buf) consume(buf);
  return final || { success: false, message: '서버 응답 없음' };
}

// ── 로그 ──
function addLog(msg, type='') {
  const area = document.getElementById('log-area');
  const now  = new Date().toLocaleTimeString('ko-KR', { hour12: false });
  const div  = document.createElement('div');
  div.className = `log-line ${type ? 'log-'+type : ''}`;
  div.innerHTML = `<span class="log-time">${now}</span><span class="log-msg">${esc(msg)}</span>`;
  area.appendChild(div);
  area.scrollTop = area.scrollHeight;
}

// ── 실행 — 비즈핏취소(계정별 그룹, /cleanup-cancel)와 유입플환불(/cleanup-youpfl-refund)을 각자 선택된 행만 처리 ──
async function startProcess() {
  const checked = entries.filter(e => e.checked);
  if (!checked.length) { alert('항목을 선택해주세요.'); return; }

  const selected = checked.filter(e => e.status !== 'success');
  const skipped  = checked.length - selected.length;
  if (!selected.length) { alert('선택한 항목이 모두 완료 상태입니다. (이미 완료된 항목은 재실행 시 자동으로 건너뜁니다)'); return; }

  const summary = selected.map(e => {
    const acts = [e.do_bizfit?'비즈핏취소':'', e.do_youpfl?'유입플환불':''].filter(Boolean).join('+');
    return `  · ${e.mid}: ${acts}`;
  }).join('\n');
  if (!confirm(`아래 항목을 처리하시겠습니까?\n\n${summary}\n\n총 ${selected.length}건${skipped ? ` (완료된 ${skipped}건은 건너뜀)` : ''}\n되돌릴 수 없습니다.`)) return;

  document.getElementById('btn-run').disabled = true;
  document.getElementById('progress-wrap').style.display = 'block';
  selected.forEach(e => { e.status = 'running'; e.result = ''; e._bizfitMsg = null; e._bizfitOk = null; e._youpflMsg = null; e._youpflOk = null; });
  renderList();
  addLog(`▶ 시작 — ${selected.length}개 항목${skipped ? ` (완료 ${skipped}건 건너뜀)` : ''}`, 'info');
  document.getElementById('progress-bar').style.width = '10%';

  // ── 1단계: 비즈핏취소 — 계정(ID/PW) 단위로 묶어서 순차 호출 ──
  const bizfitRows = selected.filter(e => e.do_bizfit);
  const groups = new Map(); // "id pw" -> {id, pw, mids:Set}
  bizfitRows.forEach(e => {
    if (!e.id || !e.pw) { e._bizfitOk = false; e._bizfitMsg = 'ID/PW 없음'; return; }
    const key = e.id + ' ' + e.pw;
    if (!groups.has(key)) groups.set(key, { id: e.id, pw: e.pw, mids: new Set() });
    groups.get(key).mids.add(e.mid);
  });

  let groupIdx = 0;
  for (const [, g] of groups) {
    groupIdx++;
    document.getElementById('progress-text').textContent = `[비즈핏] 계정 ${groupIdx} / ${groups.size} 처리 중...`;
    document.getElementById('progress-bar').style.width = Math.round(10 + (groupIdx / Math.max(groups.size,1)) * 45) + '%';
    const groupEntries = bizfitRows.filter(e => e.id === g.id && e.pw === g.pw && e._bizfitOk === null);

    try {
      const data = await fetchStream(`${SERVER}/cleanup-cancel`,
        { loginId: g.id, pwd: g.pw, mids: [...g.mids] },
        msg => addLog(`  [비즈핏] ${msg}`, 'info'));

      if (!data.success) {
        groupEntries.forEach(e => { e._bizfitOk = false; e._bizfitMsg = data.message || '서버 오류'; });
        addLog(`❌ [비즈핏] ${g.id} — ${data.message || '서버 오류'}`, 'fail');
      } else {
        const byMid = new Map();
        (data.results || []).forEach(r => { if (!byMid.has(r.mid)) byMid.set(r.mid, []); byMid.get(r.mid).push(r); });
        groupEntries.forEach(e => {
          const rows = byMid.get(e.mid) || [];
          if (!rows.length) { e._bizfitOk = false; e._bizfitMsg = '결과 없음'; }
          else {
            e._bizfitOk  = rows.every(r => r.success);
            e._bizfitMsg = rows.map(r => (r.pcode ? r.pcode + ': ' : '') + r.message).join(' / ');
          }
          addLog(`${e._bizfitOk?'✅':'❌'} [비즈핏] ${e.mid} — ${e._bizfitMsg}`, e._bizfitOk?'success':'fail');
        });
      }
    } catch (err) {
      groupEntries.forEach(e => { e._bizfitOk = false; e._bizfitMsg = err.message; });
      addLog(`❌ [비즈핏] ${g.id} 오류 — ${err.message}`, 'fail');
    }
    renderList();
  }

  // ── 2단계: 유입플환불 — mid 전체 한번에(단일 관리자 계정) ──
  const youpflRows = selected.filter(e => e.do_youpfl);
  if (youpflRows.length) {
    document.getElementById('progress-text').textContent = '[유입플] 환불 처리 중...';
    document.getElementById('progress-bar').style.width = '65%';
    const youpflMids = [...new Set(youpflRows.map(e => e.mid))];
    try {
      const res  = await fetch(`${SERVER}/cleanup-youpfl-refund`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ mids: youpflMids }),
      });
      const data = await res.json();
      if (!data.success) {
        youpflRows.forEach(e => { e._youpflOk = false; e._youpflMsg = data.message || '서버 오류'; });
        addLog(`❌ [유입플] 환불 요청 실패 — ${data.message || ''}`, 'fail');
      } else {
        const byMid = new Map();
        (data.results || []).forEach(r => byMid.set(r.mid, r));
        youpflRows.forEach(e => {
          const r = byMid.get(e.mid);
          e._youpflOk  = r ? r.success : false;
          e._youpflMsg = r ? r.message : '결과 없음';
          addLog(`${e._youpflOk?'✅':'❌'} [유입플] ${e.mid} — ${e._youpflMsg}`, e._youpflOk?'success':'fail');
        });
      }
    } catch (err) {
      youpflRows.forEach(e => { e._youpflOk = false; e._youpflMsg = err.message; });
      addLog(`❌ [유입플] 오류 — ${err.message}`, 'fail');
    }
  }

  // ── 결과 종합 ──
  let successCnt = 0, failCnt = 0;
  selected.forEach(e => {
    const parts = [];
    if (e.do_bizfit) parts.push(`[비즈핏] ${e._bizfitMsg ?? '처리 안됨'}`);
    if (e.do_youpfl) parts.push(`[유입플] ${e._youpflMsg ?? '처리 안됨'}`);
    e.result = parts.join(' | ');
    const bizfitOk = !e.do_bizfit || e._bizfitOk === true;
    const youpflOk = !e.do_youpfl || e._youpflOk === true;
    if (bizfitOk && youpflOk) { e.status = 'success'; successCnt++; }
    else if (e._bizfitOk || e._youpflOk) { e.status = 'partial'; failCnt++; }
    else { e.status = 'fail'; failCnt++; }
  });

  document.getElementById('progress-bar').style.width = '100%';
  document.getElementById('progress-text').textContent = `완료 — 성공: ${successCnt}  실패/부분: ${failCnt}`;
  addLog(`━━ 완료 — 성공: ${successCnt}  실패/부분: ${failCnt}`, failCnt===0?'success':'warn');

  save();
  renderList();
  document.getElementById('btn-run').disabled = false;
}

// ── 엑셀 업로드 ──
(function() {
  const zone = document.getElementById('excel-drop-zone');
  zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('drag-over'); });
  zone.addEventListener('dragleave', () => zone.classList.remove('drag-over'));
  zone.addEventListener('drop', e => {
    e.preventDefault(); zone.classList.remove('drag-over');
    if (e.dataTransfer.files[0]) handleExcelFile(e.dataTransfer.files[0]);
  });
})();

function handleExcelFile(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array' });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const range = XLSX.utils.decode_range(ws['!ref'] || 'A1');
      if (range.e.r > 5000) range.e.r = 5000;
      const rows = XLSX.utils.sheet_to_json(ws, { header:1, defval:'', range });
      if (!rows.length) { addLog('⚠️ 빈 파일입니다.', 'warn'); return; }
      const hdr        = rows[0].map(h => String(h||'').trim());
      const hasHdr      = isNaN(Number(hdr[0]));
      const agencyCol   = hasHdr ? hdr.findIndex(h => /영업점|매장|점명/i.test(h)) : 0;
      const idCol       = hasHdr ? hdr.findIndex(h => /^id$/i.test(h)) : 1;
      const pwCol       = hasHdr ? hdr.findIndex(h => /^pw$|비밀번호/i.test(h)) : 2;
      const midCol      = hasHdr ? Math.max(hdr.findIndex(h => /mid/i.test(h)), 0) : 3;
      const bizfitCol   = hasHdr ? hdr.findIndex(h => /비즈핏/i.test(h)) : 4;
      const youpflCol   = hasHdr ? hdr.findIndex(h => /유입플/i.test(h)) : 5;
      const start       = hasHdr ? 1 : 0;
      let added = 0, skipped = 0;

      for (let r = start; r < rows.length; r++) {
        const row       = rows[r];
        const agency    = agencyCol >= 0 ? String(row[agencyCol]||'').trim() : '';
        const id        = idCol     >= 0 ? String(row[idCol]||'').trim() : '';
        const pw        = pwCol     >= 0 ? String(row[pwCol]||'').trim() : '';
        const mid       = String(row[midCol] || '').trim();
        const do_bizfit = bizfitCol >= 0 && String(row[bizfitCol] || '').trim().toUpperCase() === 'O';
        const do_youpfl = youpflCol >= 0 && String(row[youpflCol] || '').trim().toUpperCase() === 'O';
        if (!mid || (!do_bizfit && !do_youpfl)) { skipped++; continue; }
        if (do_bizfit && (!id || !pw)) { skipped++; continue; }
        if (entries.some(e => e.id === id && e.pw === pw && e.mid === mid)) { skipped++; continue; }
        entries.push({ agency, id, pw, mid, do_bizfit, do_youpfl, status:'ready', result:'' });
        added++;
      }

      save(); renderList();
      document.getElementById('excel-file-input').value = '';
      if (added > 0) addLog(`📊 엑셀 가져오기: ${added}개 추가${skipped?', '+skipped+'개 건너뜀':''}`, 'info');
      else           addLog('⚠️ 추가된 항목 없음 — MID/작업선택이 비어있거나(비즈핏 선택 시 ID/PW 필수) 중복됨', 'warn');
    } catch(err) {
      addLog(`❌ 엑셀 읽기 실패: ${err.message}`, 'fail');
    }
  };
  reader.readAsArrayBuffer(file);
}

// ── 한글 IME 유지 — 탭/앱 전환 후 복귀 시 검색창 IME 상태 복원 ──
(function() {
  const search = document.getElementById('inp-search');
  let prevActive = null;
  let showHandled = false;

  function onHide() {
    prevActive = document.activeElement;
    showHandled = false;
  }

  function onShow() {
    if (showHandled) return;
    showHandled = true;
    const prev = prevActive;
    setTimeout(function() {
      search.focus({ preventScroll: true });
      if (prev && prev !== search && prev !== document.body && typeof prev.focus === 'function') {
        setTimeout(function() {
          search.blur();
          prev.focus({ preventScroll: true });
        }, 0);
      }
    }, 50);
  }

  document.addEventListener('visibilitychange', function() {
    if (document.hidden) onHide();
    else onShow();
  });

  window.addEventListener('blur', onHide);
  window.addEventListener('focus', function() {
    if (!document.hidden) onShow();
  });
})();

// ── 초기화 ──
renderList();

(async function checkServer() {
  const badge = document.getElementById('server-status');
  let attempt = 0;
  while (true) {
    try {
      const res = await fetch(`${SERVER}/health`, { signal: AbortSignal.timeout(5000) });
      if (res.ok) { badge.textContent = '✅ 서버 연결됨'; return; }
    } catch(_) {}
    attempt++;
    badge.textContent = `⚠️ 재연결 시도 중 (${attempt})`;
    await new Promise(r => setTimeout(r, 5000));
  }
})();

<script type="module">
  import { db } from "../ha-tools.js";
  import { ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-database.js";

  const userId = localStorage.getItem('ha_user');
  if (!userId) { location.replace("../login.html"); }

  const dataRef = ref(db, `users/${userId}/bizfit_cleanup`);

  onValue(dataRef, (snap) => {
    const data = snap.val();
    if (Array.isArray(data) && data.length > 0) {
      entries = data.map(e => ({ ...e, status: 'ready', result: '', checked: e.checked ?? false }));
      renderList();
      addLog(`📂 목록 불러옴 (${entries.length}개)`, 'info');
    }
  }, { onlyOnce: true });

  window.fbSave = (data) => set(dataRef, data).catch(e => console.error('Firebase 저장 실패:', e));
</script>
