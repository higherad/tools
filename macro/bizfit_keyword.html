<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BizFit 키워드 변경</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', -apple-system, sans-serif; background: #f0f2f5; color: #1a1a2e; min-height: 100vh; }

  .container {
    max-width: 1200px; margin: 24px auto; padding: 0 20px;
    display: grid; grid-template-columns: 260px 1fr 420px; gap: 18px; align-items: start;
  }

  .card { background: #fff; border-radius: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); overflow: hidden; }
  .card-header {
    background: #f8f9fb; padding: 13px 18px; border-bottom: 1px solid #e8eaf0;
    display: flex; align-items: center; justify-content: space-between;
  }
  .card-title { font-size: 13px; font-weight: 700; color: #2d3748; display: flex; align-items: center; gap: 7px; }
  .card-body { padding: 18px; }

  label { display: block; font-size: 11px; font-weight: 600; color: #4a5568; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.4px; }
  input[type="text"] {
    width: 100%; padding: 8px 11px; border: 1.5px solid #e2e8f0; border-radius: 7px;
    font-size: 13px; color: #2d3748; outline: none; transition: border-color 0.2s;
  }
  input[type="text"]:focus { border-color: #0277bd; }
  input::placeholder { color: #a0aec0; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    padding: 8px 16px; border-radius: 7px; font-size: 13px; font-weight: 600;
    cursor: pointer; border: none; transition: all 0.15s;
  }
  .btn-primary  { background: #059669; color: #fff; width: 100%; }
  .btn-primary:hover  { background: #047857; }
  .btn-danger   { background: #fff1f0; color: #e53e3e; border: 1.5px solid #fed7d7; padding: 4px 10px; font-size: 12px; border-radius: 6px; white-space: nowrap; }
  .btn-danger:hover   { background: #ffe0de; }
  .btn-run      { background: #0277bd; color: #fff; font-size: 14px; font-weight: 800; padding: 12px 24px; border-radius: 8px; width: 100%; }
  .btn-run:hover      { background: #01579b; }
  .btn-run:disabled   { background: #a0aec0; cursor: not-allowed; }
  .btn-sm { padding: 4px 10px; font-size: 12px; }

  .switch-wrap { display: flex; align-items: center; gap: 6px; }
  .switch-label { font-size: 12px; font-weight: 700; color: #4a5568; line-height: 20px; }
  .switch { position: relative; display: inline-block; width: 36px; height: 20px; flex-shrink: 0; margin: 0; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch .slider {
    position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
    background-color: #cbd5e0; transition: 0.2s; border-radius: 20px;
  }
  .switch .slider::before {
    position: absolute; content: ""; height: 16px; width: 16px; left: 2px; bottom: 2px;
    background-color: #fff; transition: 0.2s; border-radius: 50%;
  }
  .switch input:checked + .slider { background-color: #0277bd; }
  .switch input:checked + .slider::before { transform: translateX(16px); }

  .type-badge {
    display: inline-block; padding: 2px 7px; border-radius: 100px; font-size: 10px; font-weight: 700; white-space: nowrap;
  }
  .type-pcode  { background: #e9d8fd; color: #553c9a; }

  .table-wrap { overflow-x: auto; }
  .kw-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .kw-table thead th {
    background: #f8f9fb; padding: 8px 10px; text-align: left;
    font-size: 11px; font-weight: 700; color: #718096;
    text-transform: uppercase; letter-spacing: 0.4px; border-bottom: 1px solid #e8eaf0; white-space: nowrap;
  }
  .kw-table thead th:first-child { padding-left: 12px; }
  .kw-table tbody tr { border-bottom: 1px solid #f0f2f5; transition: background 0.1s; }
  .kw-table tbody tr:last-child { border-bottom: none; }
  .kw-table tbody tr:hover { background: #fafbfc; }
  .kw-table tbody tr.checked { background: #e3f2fd; }
  .kw-table td { padding: 7px 10px; vertical-align: middle; }
  .kw-table td:first-child { padding-left: 12px; }

  .td-id       { font-weight: 700; color: #2d3748; font-family: monospace; font-size: 11.5px; }
  .td-agency   { color: #718096; font-size: 11.5px; }
  .td-keywords { color: #4a5568; font-size: 11px; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .status-badge { display: inline-block; padding: 2px 8px; border-radius: 100px; font-size: 11px; font-weight: 700; white-space: nowrap; }
  .s-ready   { background: #edf2f7; color: #718096; }
  .s-running { background: #e3f2fd; color: #1565c0; }
  .s-success { background: #c6f6d5; color: #276749; }
  .s-fail    { background: #fed7d7; color: #c53030; }

  .select-all-row {
    display: flex; align-items: center; gap: 8px; padding: 9px 14px;
    background: #f8f9fb; border-bottom: 1px solid #e8eaf0;
    font-size: 12px; font-weight: 600; color: #4a5568;
  }
  .select-all-row input[type="checkbox"] { width: 15px; height: 15px; accent-color: #0277bd; cursor: pointer; }

  .empty-state { text-align: center; padding: 48px 20px; color: #a0aec0; font-size: 13px; }
  .empty-icon  { font-size: 32px; margin-bottom: 10px; }

  .badge { display: inline-block; padding: 2px 8px; border-radius: 100px; font-size: 11px; font-weight: 700; }
  .badge-blue { background: #e3f2fd; color: #1565c0; border: 1px solid #bbdefb; }
  .badge-teal { background: #e0f2f1; color: #00695c; border: 1px solid #b2dfdb; }

  .summary-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 16px; }
  .summary-item { background: #f8f9fb; border-radius: 8px; padding: 12px 14px; text-align: center; }
  .summary-label { font-size: 10px; font-weight: 700; color: #718096; text-transform: uppercase; letter-spacing: 0.4px; }
  .summary-value { font-size: 22px; font-weight: 800; color: #2d3748; margin-top: 4px; }
  .summary-value.blue { color: #0277bd; }

  .log-area {
    background: #1a202c; border-radius: 10px; padding: 12px 14px; height: 320px;
    overflow-y: auto; font-family: 'Consolas', 'Monaco', monospace; font-size: 12px; line-height: 1.7;
  }
  .log-line    { display: flex; gap: 10px; }
  .log-time    { color: #4a5568; flex-shrink: 0; }
  .log-msg     { color: #e2e8f0; }
  .log-success .log-msg { color: #68d391; }
  .log-fail    .log-msg { color: #fc8181; }
  .log-info    .log-msg { color: #63b3ed; }
  .log-warn    .log-msg { color: #f6e05e; }

  .progress-wrap { background: #e2e8f0; border-radius: 100px; height: 5px; overflow: hidden; display: none; margin-bottom: 8px; }
  .progress-bar  { height: 100%; background: linear-gradient(90deg, #0277bd, #26c6da); border-radius: 100px; width: 0%; transition: width 0.4s ease; }

  .divider { border: none; border-top: 1px solid #e8eaf0; margin: 14px 0; }

  .search-wrap {
    display: flex; align-items: center; gap: 6px; background: #f0f2f5;
    border: 1.5px solid #e2e8f0; border-radius: 7px; padding: 4px 10px; transition: border-color 0.2s;
  }
  .search-wrap:focus-within { border-color: #0277bd; background: #fff; }
  .search-wrap input { border: none; background: transparent; outline: none; font-size: 12px; color: #2d3748; width: 140px; padding: 0; height: 22px; }
  .search-wrap input::placeholder { color: #a0aec0; }

  .excel-upload-area {
    border: 2px dashed #cbd5e0; border-radius: 10px; padding: 18px 16px; text-align: center;
    cursor: pointer; transition: all 0.2s; background: #fafbfc;
  }
  .excel-upload-area:hover, .excel-upload-area.drag-over { border-color: #0277bd; background: #e3f2fd; }
  .excel-upload-area .upload-icon { font-size: 28px; margin-bottom: 6px; }
  .excel-upload-area .upload-text { font-size: 13px; font-weight: 600; color: #4a5568; }
  .excel-upload-area .upload-hint { font-size: 11px; color: #a0aec0; margin-top: 3px; }
  #excel-file-input { display: none; }
  .excel-tpl-btn { display:inline-flex; align-items:center; justify-content:center; width:20px; height:20px; border-radius:5px; border:1px solid #a7f3d0; background:#fff; color:#059669; text-decoration:none; cursor:pointer; transition:all .15s; }
  .excel-tpl-btn:hover { background:#ecfdf5; border-color:#059669; }

  @media (max-width: 1000px) { .container { grid-template-columns: 260px 1fr; } .run-panel { grid-column: 1 / -1; } }
  @media (max-width: 700px)  { .container { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<div class="container">

  <!-- 좌측: 엑셀 등록 -->
  <div>
    <div class="card">
      <div class="card-header"><span class="card-title">📂 엑셀 등록</span><a class="excel-tpl-btn" href="양식/키워드변경_양식.xlsx" download="키워드변경_양식.xlsx" title="양식 다운로드"><svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M14 2h-4v11H5l7 7 7-7h-5V2z"/></svg></a></div>
      <div class="card-body">
        <div class="excel-upload-area" id="excel-drop-zone" onclick="document.getElementById('excel-file-input').click()">
          <div class="upload-icon">📊</div>
          <div class="upload-text">클릭 또는 드래그 업로드</div>
          <div class="upload-hint">영업점 / MID / Pcode / 비즈핏 키워드 / 유입플 키워드</div>
        </div>
        <input type="file" id="excel-file-input" accept=".xlsx,.xls" onchange="handleExcelFile(this.files[0])">
      </div>
    </div>
  </div>

  <!-- 중앙: 목록 -->
  <div>
    <div class="card">
      <div class="card-header">
        <span class="card-title">📋 처리 목록 <span class="badge badge-blue" id="entry-count">0</span></span>
        <div class="search-wrap">
          <span style="font-size:12px;">🔍</span>
          <input type="text" id="inp-search" placeholder="MID / Pcode 검색" oninput="filterList(this.value)" lang="ko" inputmode="text" />
        </div>
      </div>
      <div class="select-all-row">
        <input type="checkbox" id="chk-all" onchange="toggleAll(this)">
        <span>전체 선택</span>
        <span style="color:#718096;font-weight:400;" id="selected-count-small">0개 선택됨</span>
        <div style="margin-left:auto;display:flex;gap:6px;">
          <button class="btn btn-danger btn-sm" onclick="removeAll()">전체삭제</button>
        </div>
      </div>
      <div class="table-wrap">
        <table class="kw-table">
          <thead>
            <tr>
              <th style="width:36px;"></th>
              <th>영업점</th>
              <th>MID</th>
              <th>비즈핏 키워드</th>
              <th>유입플 키워드</th>
              <th style="width:72px;">상태</th>
            </tr>
          </thead>
          <tbody id="entry-tbody">
            <tr><td colspan="6">
              <div class="empty-state"><div class="empty-icon">📋</div><div>등록된 항목이 없습니다.<br>좌측에서 엑셀로 등록해주세요.</div></div>
            </td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- 우측: 실행 -->
  <div class="run-panel">
    <div class="card">
      <div class="card-header">
        <span class="card-title">⚡ 실행 <span class="badge badge-teal" id="server-status">연결 확인 중...</span></span>
        <div class="switch-wrap" title="MID 캠페인 수만큼 키워드 균등 배분">
          <span class="switch-label">배분</span>
          <label class="switch">
            <input type="checkbox" id="inp-distribute-global">
            <span class="slider"></span>
          </label>
        </div>
      </div>
      <div class="card-body">
        <div class="summary-row">
          <div class="summary-item">
            <div class="summary-label">선택 항목</div>
            <div class="summary-value blue" id="sum-count">0</div>
          </div>
          <div class="summary-item">
            <div class="summary-label">키워드 없음</div>
            <div class="summary-value" id="sum-nokw" style="color:#e53e3e;">0</div>
          </div>
        </div>
        <hr class="divider">
        <button class="btn btn-run" id="btn-run" onclick="startProcess()" disabled>⚡ 키워드 변경 시작</button>
        <div style="height:10px;"></div>
        <div class="progress-wrap" id="progress-wrap"><div class="progress-bar" id="progress-bar"></div></div>
        <div style="text-align:center;font-size:12px;color:#718096;margin-top:4px;" id="progress-text"></div>
        <div class="log-area" id="log-area" style="margin-top:14px;">
          <div class="log-line log-info">
            <span class="log-time">--:--:--</span>
            <span class="log-msg">캠페인을 추가하고 실행하세요.</span>
          </div>
        </div>
      </div>
    </div>
  </div>

</div>

<script>
const SERVER = 'https://macro-3-bizfit-keyword-938928195180.asia-northeast3.run.app';
let entries = [];

function save() { if (window.fbSave) window.fbSave(entries); }

function removeAll() {
  if (!entries.length) { alert('삭제할 항목이 없습니다.'); return; }
  if (!confirm(`전체 ${entries.length}개 항목을 삭제하시겠습니까?`)) return;
  entries = [];
  save(); renderList();
}

function toggleItem(i, el) {
  entries[i].checked = el.checked;
  const row = document.getElementById(`row-${i}`);
  if (row) row.classList.toggle('checked', el.checked);
  syncAll();
}
function toggleAll(el) { entries.forEach(e => e.checked = el.checked); save(); renderList(); }
function syncAll() {
  const total   = entries.length;
  const checked = entries.filter(e => e.checked).length;
  const allChk  = document.getElementById('chk-all');
  allChk.checked       = total > 0 && checked === total;
  allChk.indeterminate = checked > 0 && checked < total;
  document.getElementById('selected-count-small').textContent = `${checked}개 선택됨`;
  updateSummary();
}
function isRunnable(e) { return !!e.keywords || !!e.yupflKeywords; }

function updateSummary() {
  const sel  = entries.filter(e => e.checked);
  const noKw = sel.filter(e => !e.keywords).length;
  document.getElementById('sum-count').textContent = sel.length;
  document.getElementById('sum-nokw').textContent  = noKw;
  // 비즈핏 키워드가 없어도 유입플 키워드만으로 실행 가능한 항목이 하나라도 있으면 막지 않는다
  document.getElementById('btn-run').disabled = sel.length === 0 || !sel.some(isRunnable);
}

let searchQuery = '';
function filterList(val) { searchQuery = val.trim().toLowerCase(); renderList(); }

function renderList() {
  const tbody = document.getElementById('entry-tbody');
  document.getElementById('entry-count').textContent = entries.length;

  if (!entries.length) {
    tbody.innerHTML = `<tr><td colspan="6"><div class="empty-state"><div class="empty-icon">📋</div><div>등록된 항목이 없습니다.</div></div></td></tr>`;
    syncAll(); return;
  }

  const filtered = searchQuery
    ? entries.filter(e => e.mid.includes(searchQuery) || (e.pcode||'').toLowerCase().includes(searchQuery))
    : entries;

  if (!filtered.length) {
    tbody.innerHTML = `<tr><td colspan="6"><div class="empty-state"><div class="empty-icon">🔍</div><div>검색 결과가 없습니다.</div></div></td></tr>`;
    syncAll(); return;
  }

  const sc = { ready:'s-ready', running:'s-running', success:'s-success', fail:'s-fail' };
  const st = { ready:'대기', running:'⏳ 진행중', success:'✅ 완료', fail:'❌ 실패' };

  tbody.innerHTML = filtered.map(e => {
    const i = entries.indexOf(e);
    return `
    <tr id="row-${i}" class="${e.checked?'checked':''}">
      <td><input type="checkbox" ${e.checked?'checked':''} onchange="toggleItem(${i},this)" style="width:15px;height:15px;accent-color:#0277bd;cursor:pointer;"></td>
      <td class="td-agency">${esc(e.agency||'-')}</td>
      <td>
        <div class="td-id">${esc(e.mid)}</div>
        ${e.pcode?`<div style="margin-top:2px;"><span class="type-badge type-pcode" title="${esc(e.pcode)}" style="cursor:default;">Pcode</span></div>`:''}
        ${e.result?`<div style="font-size:10.5px;color:#718096;margin-top:2px;">${esc(e.result)}</div>`:''}
      </td>
      <td><div class="td-keywords" title="${esc(e.keywords)}">${esc(e.keywords)}</div></td>
      <td>${yupflBadge(e)}</td>
      <td><span class="status-badge ${sc[e.status]||'s-ready'}">${st[e.status]||'대기'}</span></td>
    </tr>`;
  }).join('');

  syncAll();
}

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// 키워드는 나열하지 않고 개수만, 전체 목록은 title 툴팁으로.
function yupflBadge(e) {
  const list = String(e.yupflKeywords||'').split(',').map(k=>k.trim()).filter(Boolean);
  if (!list.length) return '<span style="color:#cbd5e0;font-size:11px;">-</span>';
  return `<span title="${esc(list.join(', '))}" class="badge badge-blue" style="cursor:default;">${list.length}개</span>`;
}

function addLog(msg, type='') {
  const area = document.getElementById('log-area');
  const now  = new Date().toLocaleTimeString('ko-KR', { hour12: false });
  const div  = document.createElement('div');
  div.className = `log-line ${type?'log-'+type:''}`;
  div.innerHTML = `<span class="log-time">${now}</span><span class="log-msg">${esc(msg)}</span>`;
  area.appendChild(div);
  area.scrollTop = area.scrollHeight;
}

// SSE(/process-stream 형식) 응답을 소비하며 entry_result마다 onResult 호출 — 비즈핏/유입플 공용
async function runStream(url, payload, onResult) {
  const res = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ entries: payload }),
  });
  if (!res.ok) throw new Error(`서버 응답 오류 (${res.status})`);

  const reader  = res.body.getReader();
  const decoder = new TextDecoder();
  let buffer = '';

  while (true) {
    const { done, value } = await reader.read();
    if (done) return;

    buffer += decoder.decode(value, { stream: true });
    const lines = buffer.split('\n');
    buffer = lines.pop();

    for (const line of lines) {
      if (!line.startsWith('data: ')) continue;
      let data;
      try { data = JSON.parse(line.slice(6)); } catch { continue; }
      if (data.ping) continue;
      if (data.entry_result) onResult(data.entry_result);
      if (data.error) throw new Error(data.error);
      if (data.done) return;
    }
  }
}

// 비즈핏(_bizOk/_bizMsg)과 유입플(_yupflOk/_yupflMsg) 결과를 합쳐 행 하나의 상태/메시지로 정리.
// 해당 항목에 실제로 적용됐던 매크로들이 전부 성공해야 최종 success.
function finalizeEntry(entry) {
  const needsBiz   = !!entry.keywords;
  const needsYupfl = !!entry.yupflKeywords;
  const bizDone    = !needsBiz   || entry._bizOk   !== undefined;
  const yupflDone  = !needsYupfl || entry._yupflOk !== undefined;
  // 둘 다 대상인 항목은 비즈핏이 먼저 끝나도(유입플은 그 뒤 스트림에서 처리) 아직
  // 전체가 끝난 게 아니므로 성공/실패로 확정 짓지 않고 진행중으로 유지한다.
  if (!bizDone || !yupflDone) {
    const parts = [];
    if (entry._bizOk   !== undefined) parts.push(`비즈핏: ${entry._bizMsg}`);
    if (entry._yupflOk !== undefined) parts.push(`유입플: ${entry._yupflMsg}`);
    entry.status = 'running';
    entry.result = parts.join(' / ');
    return;
  }
  const parts = [];
  let allOk = true;
  if (needsBiz)   { parts.push(`비즈핏: ${entry._bizMsg}`);   allOk = allOk && entry._bizOk; }
  if (needsYupfl) { parts.push(`유입플: ${entry._yupflMsg}`); allOk = allOk && entry._yupflOk; }
  entry.status = allOk ? 'success' : 'fail';
  entry.result = parts.join(' / ');
}

async function startProcess() {
  const checked = entries.filter(e => e.checked);
  if (!checked.length) { alert('항목을 선택해주세요.'); return; }

  const notDone     = checked.filter(e => e.status !== 'success');
  const doneSkipped = checked.length - notDone.length;
  const bizTargets   = notDone.filter(e => e.keywords);
  const yupflTargets = notDone.filter(e => e.yupflKeywords);
  const runTargets   = [...new Set([...bizTargets, ...yupflTargets])];

  if (!runTargets.length) {
    alert(doneSkipped
      ? '선택한 항목이 모두 완료 상태입니다. (이미 완료된 항목은 재실행 시 자동으로 건너뜁니다)'
      : '실행할 비즈핏/유입플 키워드가 없습니다.');
    return;
  }

  const distribute = document.getElementById('inp-distribute-global').checked;
  const summary = runTargets.map(e => {
    const tags = [];
    if (e.keywords) tags.push('비즈핏');
    if (e.yupflKeywords) tags.push('유입플');
    return `  · ${e.mid}${e.pcode?' / '+e.pcode:''} (${tags.join('+')})`;
  }).join('\n');
  if (!confirm(`아래 캠페인의 키워드를 변경하시겠습니까?${distribute ? '\n(배분 모드 ON — MID 캠페인 수만큼 키워드 균등 배분, 비즈핏에만 적용)' : ''}\n\n${summary}\n\n총 ${runTargets.length}건${doneSkipped ? ` (완료된 ${doneSkipped}건은 건너뜀)` : ''}`)) return;

  document.getElementById('btn-run').disabled = true;
  document.getElementById('progress-wrap').style.display = 'block';

  runTargets.forEach(e => {
    e.status = 'running'; e.result = '';
    e._bizOk = undefined; e._bizMsg = ''; e._yupflOk = undefined; e._yupflMsg = '';
  });
  renderList();

  addLog(`▶ 시작 — ${runTargets.length}개 캠페인${distribute ? ' (배분 모드)' : ''}${doneSkipped ? ` (완료 ${doneSkipped}건 건너뜀)` : ''}`, 'info');
  document.getElementById('progress-bar').style.width = '10%';
  document.getElementById('progress-text').textContent = '로그인 중...';

  const totalOps = bizTargets.length + yupflTargets.length;
  let processed = 0;
  function bumpProgress() {
    processed++;
    const pct = 10 + Math.round((processed / totalOps) * 90);
    document.getElementById('progress-bar').style.width = pct + '%';
    document.getElementById('progress-text').textContent = `${processed} / ${totalOps} 처리 중...`;
  }

  // 매크로 하나가 서버 오류로 죽어도 다른 매크로(비즈핏/유입플)는 계속 진행되도록
  // 에러를 여기서 흡수하고, 그 매크로가 담당하던 항목들만 실패 처리한다.
  async function runMacroBatch(url, targets, payload, matchFn, okField, msgField, label) {
    try {
      await runStream(url, payload, r => {
        const entry = matchFn(r);
        if (entry) {
          entry[okField] = r.success; entry[msgField] = r.message;
          finalizeEntry(entry);
          addLog(`${r.success?'✅':'❌'} [${label}] ${r.mid}${r.pcode?' / '+r.pcode:''} — ${r.message}`, r.success?'success':'fail');
        }
        bumpProgress(); renderList();
      });
    } catch (e) {
      targets.forEach(entry => {
        if (entry[okField] === undefined) {
          entry[okField] = false; entry[msgField] = e.message;
          finalizeEntry(entry);
        }
      });
      addLog(`❌ ${label} 서버 오류: ${e.message}`, 'fail');
      renderList();
    }
  }

  // 비즈핏/유입플을 동시에 실행 — 순서대로 돌리면 사이트 로그인이 두 번 직렬로 걸려 느려짐
  const tasks = [];
  if (bizTargets.length) {
    const payload = bizTargets.map(e => ({ mid: e.mid, pcode: e.pcode||'', agency: e.agency||'', keywords: e.keywords, distribute }));
    tasks.push(runMacroBatch(`${SERVER}/process-stream`, bizTargets, payload,
      r => entries.find(e => e.mid === r.mid && (e.pcode||'') === (r.pcode||'')), '_bizOk', '_bizMsg', '비즈핏'));
  }
  if (yupflTargets.length) {
    const payload = yupflTargets.map(e => ({ mid: e.mid, keywords: e.yupflKeywords }));
    // ponytail: 부분 실패 후 재실행하면 이미 성공한 쪽(비즈핏 또는 유입플)도 다시 시도됨 —
    // 필요해지면 _bizOk/_yupflOk별로 재실행 대상을 나눠서 스킵 추가.
    tasks.push(runMacroBatch(`${SERVER}/yupfl-process-stream`, yupflTargets, payload,
      r => entries.find(e => e.mid === r.mid), '_yupflOk', '_yupflMsg', '유입플'));
  }
  await Promise.all(tasks);

  const successCnt = runTargets.filter(e => e.status === 'success').length;
  const failCnt     = runTargets.filter(e => e.status === 'fail').length;
  document.getElementById('progress-bar').style.width = '100%';
  document.getElementById('progress-text').textContent = `완료 — 성공: ${successCnt}  실패: ${failCnt}`;
  addLog(`━━ 완료 — 성공: ${successCnt}  실패: ${failCnt}`, successCnt===runTargets.length?'success':'warn');

  save(); renderList();
  document.getElementById('btn-run').disabled = false;
}

// ── 엑셀 업로드 ──
(function() {
  const zone = document.getElementById('excel-drop-zone');
  zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('drag-over'); });
  zone.addEventListener('dragleave', () => zone.classList.remove('drag-over'));
  zone.addEventListener('drop', e => { e.preventDefault(); zone.classList.remove('drag-over'); if (e.dataTransfer.files[0]) handleExcelFile(e.dataTransfer.files[0]); });
})();

function handleExcelFile(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array' });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const range = XLSX.utils.decode_range(ws['!ref'] || 'A1');
      if (range.e.r > 5000) range.e.r = 5000;
      const rows = XLSX.utils.sheet_to_json(ws, { header:1, defval:'', range });
      if (!rows.length) { addLog('⚠️ 빈 파일입니다.', 'warn'); return; }
      const hdr       = rows[0].map(h => String(h||'').trim());
      const hasHdr    = isNaN(Number(hdr[0]));
      const agencyCol = hasHdr ? hdr.findIndex(h => /영업점/i.test(h)) : 0;
      const midCol    = hasHdr ? Math.max(hdr.findIndex(h => /mid/i.test(h)), 0) : 1;
      const pcodeCol  = hasHdr ? hdr.findIndex(h => /pcode/i.test(h)) : 2;
      const yupflCol  = hasHdr ? hdr.findIndex(h => /유입플/.test(h)) : 4;
      // "유입플키워드" 헤더도 /키워드/에 걸리므로 그 열은 제외하고 찾는다
      const kwCol     = hasHdr ? hdr.findIndex((h, i) => /키워드/i.test(h) && i !== yupflCol) : 3;
      const start     = hasHdr ? 1 : 0;
      // 영업점·Pcode는 어떤 경우든 양식에 있어야 하는 필수 컬럼 — 못 찾으면 양식 자체가 다른 것
      const missingCols = [];
      if (agencyCol < 0) missingCols.push('영업점');
      if (pcodeCol  < 0) missingCols.push('Pcode');
      if (hasHdr && missingCols.length) {
        addLog(`⚠️ 양식이 맞지 않습니다 — ${missingCols.join('/')} 컬럼을 찾을 수 없습니다. 정식 양식(키워드변경_양식.xlsx)을 다시 받아 확인해주세요.`, 'warn');
        return;
      }
      let added = 0, skipped = 0;

      for (let r = start; r < rows.length; r++) {
        const row           = rows[r];
        const agency        = agencyCol >= 0 ? String(row[agencyCol]||'').trim() : '';
        const mid           = String(row[midCol]   || '').trim();
        const pcode         = pcodeCol >= 0 ? String(row[pcodeCol]||'').trim() : '';
        const keywords      = kwCol    >= 0 ? String(row[kwCol]   ||'').trim() : '';
        const yupflKeywords = yupflCol >= 0 ? String(row[yupflCol]||'').trim() : '';
        if (!mid || (!keywords && !yupflKeywords)) { skipped++; continue; }
        // 비즈핏 키워드 변경은 pcode 기반이라 영업점·pcode 둘 다 필수 — 유입플만 쓰는 행은 면제
        if (keywords && (!pcode || !agency)) { skipped++; continue; }
        if (entries.some(e => e.mid === mid && (e.pcode||'') === pcode)) { skipped++; continue; }
        entries.push({ mid, pcode, agency, keywords, yupflKeywords, status: 'ready', result: '' });
        added++;
      }

      save(); renderList();
      document.getElementById('excel-file-input').value = '';
      if (added > 0) addLog(`📊 엑셀 가져오기: ${added}개 추가${skipped?', '+skipped+'개 건너뜀':''}`, 'info');
      else           addLog('⚠️ 추가된 항목 없음 — MID·키워드가 비어있거나 중복, 또는 비즈핏 키워드 행에 영업점/Pcode 누락', 'warn');
    } catch(err) { addLog(`❌ 엑셀 읽기 실패: ${err.message}`, 'fail'); }
  };
  reader.readAsArrayBuffer(file);
}

renderList();

// ── 한글 IME 유지 ──
(function() {
  const search = document.getElementById('inp-search');
  let prevActive = null;
  let showHandled = false;

  function onHide() { prevActive = document.activeElement; showHandled = false; }
  function onShow() {
    if (showHandled) return;
    showHandled = true;
    const prev = prevActive;
    setTimeout(function() {
      const active = document.activeElement;
      if (active && active !== document.body && active !== search) return;
      search.focus({ preventScroll: true });
      if (prev && prev !== search && prev !== document.body && typeof prev.focus === 'function') {
        setTimeout(function() { search.blur(); prev.focus({ preventScroll: true }); }, 0);
      }
    }, 50);
  }

  document.addEventListener('visibilitychange', function() { if (document.hidden) onHide(); else onShow(); });
  window.addEventListener('blur', onHide);
  window.addEventListener('focus', function() { if (!document.hidden) onShow(); });
})();

(async function checkServer() {
  const badge = document.getElementById('server-status');
  for (let i = 0; i < 5; i++) {
    if (i > 0) await new Promise(r => setTimeout(r, 3000));
    try {
      const res = await fetch(`${SERVER}/ping`, { signal: AbortSignal.timeout(5000) });
      if (res.ok) { badge.textContent = '✅ 서버 연결됨'; return; }
    } catch(_) {}
  }
  badge.textContent = '⚠️ 연결 실패';
})();
</script>

<script type="module">
  import { db } from "../ha-tools.js";
  import { ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-database.js";

  const userId = localStorage.getItem('ha_user');
  if (!userId) { location.replace("../login.html"); }

  const dataRef = ref(db, `users/${userId}/bizfit_keyword`);

  onValue(dataRef, (snap) => {
    const data = snap.val();
    if (Array.isArray(data) && data.length > 0) {
      // 예전 버전(id/id_type 단일 필드)으로 저장된 목록과의 호환 — id_type이 mid면 mid로, 아니면 pcode로 이관
      entries = data.map(e => ({
        ...e,
        mid:     e.mid    || (e.id_type === 'mid' ? e.id : '') || '',
        pcode:   e.pcode  || (e.id_type === 'pcode' ? e.id : '') || '',
        agency:  e.agency || '',
        status:  'ready',
        result:  '',
        checked: e.checked ?? false,
      }));
      renderList();
      addLog(`📂 목록 불러옴 (${entries.length}개)`, 'info');
    }
  }, { onlyOnce: true });

  window.fbSave = (data) => set(dataRef, data).catch(e => console.error('Firebase 저장 실패:', e));
</script>
